name: publish

on:
  release:
    types: [published]

jobs:
  stubtest:
    runs-on: windows-latest # acevo imports ctypes.WinDLL
    steps:
      - uses: actions/checkout@v6
      # stubtest imports the package on the runner's latest python
      - run: python -m pip install mypy && python -m mypy.stubtest acevo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.3" # oldest supported
      - run: python -c "import acevo.memory"

  publish:
    needs: stubtest
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # setuptools-scm needs tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
